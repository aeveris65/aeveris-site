<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AEVERIS — In Construction</title>
<meta name="description" content="AEVERIS is temporarily offline for maintenance. We'll be back shortly." />
<meta name="robots" content="noindex" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Exo+2:wght@400;500;600&family=Montserrat:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --navy-950:#060E22;  --abyss-900:#0A1633; --navy-800:#0E1B40;
  --deep-700:#12224C;  --steel-500:#2A3C63;
  --slate-500:#6E7C93; --slate-400:#8B97AB;
  --silver-300:#AEB8C6; --silver-200:#C9D0DA; --silver-100:#E7EBF1;
  --electric:#2E76FF;

  --f-wordmark:'Michroma',sans-serif;
  --f-display:'Exo 2',sans-serif;
  --f-body:'Montserrat',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;

  --track-wordmark:0.24em;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% 8%, var(--deep-700) 0%, var(--abyss-900) 46%, var(--navy-950) 100%);
  color:var(--silver-200);
  font-family:var(--f-body);
  -webkit-font-smoothing:antialiased;
}

.stage{
  position:relative;
  height:100svh; min-height:480px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px;
  text-align:center;
}

/* ambient drifting light — slow, barely-there */
.glow{
  position:absolute; inset:-10%; z-index:0; pointer-events:none;
  background:radial-gradient(38% 30% at 50% 38%, rgba(46,118,255,.10), transparent 70%);
  animation:drift 12s ease-in-out infinite;
}
@keyframes drift{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(0,-2%) scale(1.06); }
}

/* ---- mark + sonar ping ---- */
.mark{
  position:relative; z-index:1;
  width:84px; height:84px; margin:0 auto 22px;
  display:flex; align-items:center; justify-content:center;
  animation:bob 5s ease-in-out infinite;
}
@keyframes bob{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-6px); }
}
.mark svg{ width:100%; height:100%; display:block; position:relative; z-index:2; }

.ping{
  position:absolute; left:50%; bottom:11px; z-index:1;
  width:7px; height:7px; margin-left:-3.5px; margin-bottom:-3.5px;
  border-radius:50%; border:1px solid var(--electric);
  animation:ping 3s cubic-bezier(.2,.6,.4,1) infinite;
  opacity:0;
}
.ping--b{ animation-delay:1s; }
.ping--c{ animation-delay:2s; }
@keyframes ping{
  0%{ transform:scale(1); opacity:.9; }
  100%{ transform:scale(11); opacity:0; }
}

.wordmark{
  position:relative; z-index:1;
  font-family:var(--f-wordmark); font-weight:400;
  font-size:clamp(22px,4.4vw,34px);
  letter-spacing:var(--track-wordmark);
  text-indent:var(--track-wordmark);
  color:var(--silver-100);
  margin:0 0 20px;
}

.status{
  position:relative; z-index:1;
  font-family:var(--f-display); font-weight:600;
  font-size:clamp(13px,2vw,16px); letter-spacing:.42em;
  text-transform:uppercase; color:var(--electric);
  margin:0 0 20px; min-height:1.3em;
  white-space:nowrap;
}
.status::after{
  content:''; display:inline-block; width:2px; height:.9em;
  margin-left:4px; vertical-align:-0.12em;
  background:var(--electric);
  animation:caret 1s step-end infinite;
}
@keyframes caret{ 50%{ opacity:0; } }

.lede{
  position:relative; z-index:1;
  font-family:var(--f-body); font-weight:400;
  font-size:clamp(14px,1.8vw,16px); line-height:1.65;
  color:var(--slate-400); max-width:38ch; margin:0;
}

.contact{
  position:absolute; left:0; right:0; bottom:28px; z-index:1;
  font-family:var(--f-mono); font-size:11px; letter-spacing:.14em;
  color:var(--steel-500); text-transform:uppercase;
}
.contact a{ color:var(--slate-500); text-decoration:none; transition:color .2s; }
.contact a:hover{ color:var(--silver-200); }

@media (max-width:480px){
  .status{ letter-spacing:.26em; white-space:normal; }
}
@media (prefers-reduced-motion:reduce){
  .mark{ animation:none; }
  .glow{ animation:none; }
  .ping,.ping--b,.ping--c{ animation:none; display:none; }
  .status::after{ animation:none; opacity:1; }
}
</style>
</head>
<body>

<div class="stage">
  <div class="glow" aria-hidden="true"></div>

  <div class="mark" aria-hidden="true">
    <span class="ping"></span>
    <span class="ping ping--b"></span>
    <span class="ping ping--c"></span>
    <svg viewBox="0 0 100 100">
      <g fill="none" stroke-linecap="round" stroke-width="5.2">
        <polyline points="16,80 50,14 84,80" stroke="#E7EBF1"/>
        <polyline points="27,77.5 50,30 73,77.5" stroke="#AEB8C6"/>
        <polyline points="37.5,75 50,46 62.5,75" stroke="#6E7C93"/>
      </g>
      <circle cx="50" cy="79" r="3.4" fill="#2E76FF"/>
    </svg>
  </div>

  <h1 class="wordmark">AEVERIS</h1>
  <p class="status" id="status"></p>
  <p class="lede">We're deploying something beneath the surface. Back online shortly.</p>

  <div class="contact">contact&#64;aeveris.ro</div>
</div>

<script>
(function(){
  var el = document.getElementById('status');
  var text = 'In construction';
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){ el.textContent = text; return; }
  var i = 0;
  (function step(){
    el.textContent = text.slice(0, i).toUpperCase();
    if(i < text.length){ i++; setTimeout(step, 70); }
  })();
})();
</script>

</body>
</html>
